name: Validar notas

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar as notas
        run: python scripts/validar.py
      - name: Montar o site (teste)
        run: python scripts/montar.py
